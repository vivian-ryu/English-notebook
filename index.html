<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>한 줄, 영어로</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#EAEADF;--card:#F4F4EC;--ink:#1E2C22;--soft:#4B5A4E;--faint:#8A9088;--wine:#7C3B49;--deep:#5A2A34;--tint:#F1E0E2;--border:#CFCFBC}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans KR',sans-serif}.wrap{max-width:760px;margin:auto;padding:48px 24px 80px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:20px;margin-bottom:36px}.brand{font:500 26px Fraunces,serif}.brand span{color:var(--wine)}.streak,.label,.date,.hint{font:11px 'IBM Plex Mono',monospace;color:var(--faint)}button{font-family:inherit;cursor:pointer;border:0;background:none}.primary{background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:3px;font-weight:500}.primary:hover{background:var(--deep)}.ghost{color:var(--faint);padding:10px}.back{display:none;border:1px solid var(--border);padding:8px 12px;border-radius:3px;color:var(--soft)}.back.show{display:block}.onboarding{text-align:center;padding:60px 20px;border:1px dashed var(--border);border-radius:4px;color:var(--soft)}.onboarding p{line-height:1.7}.share{display:none;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);padding:12px 14px;margin-bottom:24px}.share input{flex:1;min-width:0;padding:8px;border:1px solid var(--border);background:var(--paper);font:12px 'IBM Plex Mono',monospace}.compose{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:22px 24px 20px;margin-bottom:44px}.compose.hidden{display:none}textarea{font-family:inherit}.input{width:100%;min-height:110px;resize:vertical;border:0;outline:0;background:transparent;font-size:17px;line-height:1.9;color:var(--ink);padding:0;margin-top:10px;background-image:repeating-linear-gradient(transparent,transparent 37px,#D8D8C8 38px)}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.error{display:none;color:var(--wine);font-size:12px;margin-top:6px}.preview{display:none;border-top:1px dashed var(--border);margin-top:18px;padding-top:16px}.pair{margin:0 0 16px}.ko{color:var(--soft);font-size:14.5px;margin-bottom:5px}.en{font:17px/1.6 Fraunces,serif;color:var(--deep)}.entries{display:flex;flex-direction:column;gap:12px}.empty{padding:30px 4px;text-align:center;border:1px dashed var(--border);color:var(--faint);font-size:14px}.group{border-left:3px solid var(--border)}.group-head{display:flex;gap:8px;padding:12px 16px;cursor:pointer;color:var(--soft);font:12px 'IBM Plex Mono',monospace}.group-head strong{flex:1}.group-body{display:flex;flex-direction:column;gap:8px;padding:0 16px 8px}.group-body.closed{display:none}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:4px;padding:10px 14px;cursor:pointer}.item:hover{border-color:var(--wine)}.item-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;flex:1}.delete{color:var(--faint);font-size:12px}.delete:hover{color:var(--wine)}.detail{display:none}.detail.show{display:block}.detail-title{border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:24px;font:12px 'IBM Plex Mono',monospace;color:var(--soft)}.card{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:16px;margin-bottom:16px}.card-head{display:flex;justify-content:space-between;margin-bottom:12px}.mask{height:36px;background:var(--ink);border-radius:3px;cursor:pointer;margin-top:8px}.mask.shown{display:none}.enblock{display:none;background:var(--tint);padding:10px 12px;border-radius:3px;margin-top:8px;cursor:pointer}.enblock.show{display:block}.edit{width:100%;min-height:44px;padding:8px;border:1px solid var(--border);background:var(--paper);margin:4px 0;font-size:14px}.edit-actions{display:flex;justify-content:flex-end;gap:8px}.status{font-size:12px;color:var(--wine);margin:8px 0;display:none}
</style></head><body><main class="wrap"><header><button id="back" class="back">← 돌아가기</button><div class="brand">한 줄<span>,</span> 영어로</div><div class="streak">기록 <b id="count">0</b>개</div></header><div id="share" class="share"><span class="label">공유 링크</span><input id="url" readonly><button id="copy" class="ghost">복사</button></div><section id="onboarding" class="onboarding"><p>공유 노트를 새로 만들면 링크가 생겨요.<br>그 링크를 받은 사람은 누구나 같은 노트를 보고 함께 쓸 수 있어요.</p><button id="create" class="primary">공유 노트 만들기</button><p class="label">이 링크를 아는 사람은 누구나 보고 지울 수 있으니 민감한 내용은 적지 마세요.</p></section><section id="app" style="display:none"><div id="compose" class="compose"><div class="label">한글 문장 다음 줄에 영어 문장을 써주세요 (한글, 영어 번갈아가며)</div><textarea id="input" class="input" placeholder="나는 매일 영어 공부를 한다.&#10;I study English every single day."></textarea><div id="error" class="error"></div><div class="actions"><button id="check" class="primary">확인하기</button></div><div id="preview" class="preview"><div class="label">이렇게 저장돼요</div><div id="previewList"></div><div class="actions"><button id="discard" class="ghost">취소</button><button id="save" class="primary">노트에 저장</button></div></div></div><div class="label" style="margin:0 0 14px 2px">지난 기록 · 이 링크를 여는 모든 사람과 공유됩니다</div><div id="entries" class="entries"><div id="empty" class="empty">아직 저장된 노트가 없어요.</div></div><div id="detail" class="detail"><div id="detailTitle" class="detail-title"></div><div id="detailEntries"></div></div></section></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script>
const firebaseConfig={apiKey:'AIzaSyBM7bugwRjrCe3MMm6FFqEqGEMXC85bbl8',authDomain:'vivian-project-f73d9.firebaseapp.com',projectId:'vivian-project-f73d9',storageBucket:'vivian-project-f73d9.firebasestorage.app',messagingSenderId:'110774190170',appId:'1:110774190170:web:399d59c14440a9ca6e1863'};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
const $=id=>document.getElementById(id),back=$('back'),onboarding=$('onboarding'),app=$('app'),share=$('share'),url=$('url'),input=$('input'),error=$('error'),preview=$('preview'),previewList=$('previewList'),entriesBox=$('entries'),detail=$('detail'),detailTitle=$('detailTitle'),detailEntries=$('detailEntries');let roomId=null,entries=[],pending=[];
const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML},date=s=>{const d=new Date(s);return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`},collection=()=>db.collection('rooms').doc(roomId).collection('entries');
function show(){onboarding.style.display='none';share.style.display='flex';app.style.display='block';url.value=location.href}function id(){return crypto.randomUUID?crypto.randomUUID().slice(0,12):'r'+Date.now().toString(36)}
async function load(){try{const snap=await collection().orderBy('createdAt','desc').get();entries=snap.docs.map(d=>{const x=d.data();return{id:d.id,sentences:x.sentences||[],createdAt:x.createdAt?.toDate?x.createdAt.toDate().toISOString():x.createdAt}});render()}catch(e){console.error(e);entries=[];render();error.textContent='Firebase에서 노트를 불러오지 못했어요. Firestore 규칙을 확인해주세요.';error.style.display='block'}}
async function put(e){await collection().doc(e.id).set({sentences:e.sentences,createdAt:firebase.firestore.Timestamp.fromDate(new Date(e.createdAt))})}async function remove(i){await collection().doc(i).delete()}async function update(i,s){await collection().doc(i).update({sentences:s})}
function render(){ $('count').textContent=entries.length;entriesBox.innerHTML='';if(!entries.length){entriesBox.appendChild($('empty'));return}const groups={};entries.forEach(e=>(groups[date(e.createdAt)]??=[]).push(e));Object.keys(groups).sort().reverse().forEach(day=>{const g=document.createElement('div');g.className='group';const h=document.createElement('div');h.className='group-head';h.innerHTML=`<span>▾</span><strong>${day}</strong><span>${groups[day].length}</span>`;const b=document.createElement('div');b.className='group-body';h.onclick=()=>b.classList.toggle('closed');groups[day].forEach(e=>{const i=document.createElement('div');i.className='item';i.innerHTML=`<span class="item-text">${esc(e.sentences[0]?.ko||'')}</span><button class="delete">삭제</button>`;i.querySelector('.item-text').onclick=()=>detailView(day);i.querySelector('.delete').onclick=async x=>{x.stopPropagation();if(prompt('삭제하시려면 비밀번호를 입력하세요')==='5604'){await remove(e.id);entries=entries.filter(v=>v.id!==e.id);render()}};b.appendChild(i)});g.append(h,b);entriesBox.appendChild(g)})}
function detailView(day){entriesBox.style.display='none';$('compose').style.display='none';detail.className='detail show';back.classList.add('show');detailTitle.textContent=day;detailEntries.innerHTML='';entries.filter(e=>date(e.createdAt)===day).forEach(e=>{const c=document.createElement('div');c.className='card';c.innerHTML=`<div class="card-head"><span class="date">${date(e.createdAt)}</span><button class="delete">삭제</button></div>`;e.sentences.forEach((s,n)=>{const p=document.createElement('div');p.className='pair';p.innerHTML=`<div class="ko">${esc(s.ko)}</div><div class="mask"></div><div class="enblock">${esc(s.en)}</div>`;p.querySelector('.mask').onclick=()=>{p.querySelector('.mask').classList.add('shown');p.querySelector('.enblock').classList.add('show')};p.querySelector('.enblock').onclick=()=>{p.querySelector('.enblock').classList.remove('show');p.querySelector('.mask').classList.remove('shown')};c.appendChild(p)});c.querySelector('.delete').onclick=async()=>{if(prompt('삭제하시려면 비밀번호를 입력하세요')==='5604'){await remove(e.id);entries=entries.filter(v=>v.id!==e.id);list()}};detailEntries.appendChild(c)})}
function list(){detail.className='detail';entriesBox.style.display='flex';$('compose').style.display='block';back.classList.remove('show');render()}
$('create').onclick=()=>{roomId=id();localStorage.setItem('lastRoomId',roomId);const u=new URL(location.href);u.searchParams.set('room',roomId);history.replaceState({},'',u);show();render()};back.onclick=list;
$('check').onclick=()=>{const lines=input.value.split('\n').map(x=>x.trim()).filter(Boolean);if(!lines.length||lines.length%2){error.textContent='한글과 영어 문장을 번갈아 입력해주세요.';error.style.display='block';return}error.style.display='none';pending=[];for(let i=0;i<lines.length;i+=2)pending.push({ko:lines[i],en:lines[i+1].replace(/^["“‘']|["”’']$/g,'')});previewList.innerHTML=pending.map(p=>`<div class="pair"><div class="ko">${esc(p.ko)}</div><div class="en">${esc(p.en)}</div></div>`).join('');preview.style.display='block'};$('discard').onclick=()=>{pending=[];preview.style.display='none'};$('save').onclick=async()=>{if(!pending.length)return;const e={id:'e_'+Date.now(),sentences:pending,createdAt:new Date().toISOString()};$('save').disabled=true;try{await put(e);entries.push(e);input.value='';pending=[];preview.style.display='none';render()}catch(x){console.error(x);error.textContent='저장하지 못했어요. Firebase 설정과 Firestore 규칙을 확인해주세요.';error.style.display='block'}finally{$('save').disabled=false}};$('copy').onclick=()=>navigator.clipboard?.writeText(url.value);
(function init(){const q=new URLSearchParams(location.search),r=q.get('room')||localStorage.getItem('lastRoomId');if(r){roomId=r;show();load()}})();
</script></body></html>
