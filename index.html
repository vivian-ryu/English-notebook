<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>한 줄, 영어로</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #EAEADF;
      --paper-line: #D8D8C8;
      --card: #F4F4EC;
      --ink: #1E2C22;
      --ink-soft: #4B5A4E;
      --ink-faint: #8A9088;
      --wine: #7C3B49;
      --wine-deep: #5A2A34;
      --wine-tint: #F1E0E2;
      --border: #CFCFBC;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Noto Sans KR', -apple-system, sans-serif;
      min-height: 100vh;
    }
    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 36px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
    }
    .brand {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: 26px;
      letter-spacing: -0.02em;
    }
    .brand .dot { color: var(--wine); }
    .streak {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: var(--ink-faint);
      text-align: right;
    }
    .streak b { color: var(--ink-soft); font-weight: 500; }
    .back-btn {
      display: none;
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 8px 12px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 13px;
      color: var(--ink-soft);
      cursor: pointer;
    }
    .back-btn.show { display: inline-block; }
    .share-bar {
      display: none;
      align-items: center;
      gap: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 12px 14px;
      margin-bottom: 24px;
    }
    .share-bar .share-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--ink-faint);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }
    .share-bar input {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--border);
      background: var(--paper);
      border-radius: 3px;
      padding: 8px 10px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: var(--ink-soft);
    }
    .onboarding {
      text-align: center;
      padding: 60px 20px;
      border: 1px dashed var(--border);
      border-radius: 4px;
      background: rgba(255,255,255,0.08);
    }
    .onboarding p {
      font-size: 14px;
      color: var(--ink-soft);
      line-height: 1.7;
      max-width: 420px;
      margin: 0 auto 22px;
    }
    .warn {
      font-size: 12px;
      color: var(--wine);
      margin-top: 14px;
      display: none;
    }
    .compose {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 22px 24px 20px;
      margin-bottom: 44px;
      position: relative;
    }
    .compose.hidden { display: none; }
    .compose .label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--ink-faint);
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    #koInput {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      border: none;
      background: transparent;
      outline: none;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 17px;
      line-height: 1.9;
      color: var(--ink);
      padding: 0;
      background-image: repeating-linear-gradient(transparent, transparent 37px, var(--paper-line) 38px);
    }
    #koInput::placeholder { color: var(--ink-faint); }
    .compose-foot {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 14px;
    }
    button {
      font-family: 'Noto Sans KR', sans-serif;
      cursor: pointer;
      border: none;
      background: none;
    }
    .btn-primary {
      background: var(--ink);
      color: var(--paper);
      font-size: 14px;
      font-weight: 500;
      padding: 10px 20px;
      border-radius: 3px;
    }
    .btn-primary:hover { background: var(--wine-deep); }
    .btn-primary:disabled { background: var(--ink-faint); cursor: default; }
    .btn-ghost {
      font-size: 13px;
      color: var(--ink-faint);
      padding: 10px 10px;
    }
    .btn-ghost:hover { color: var(--ink-soft); }
    .err-msg {
      font-size: 12px;
      color: var(--wine);
      margin-top: 6px;
      display: none;
    }
    .preview {
      display: none;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px dashed var(--border);
    }
    .preview .label { color: var(--wine); }
    .preview-pair { margin-bottom: 18px; }
    .preview-pair:last-child { margin-bottom: 0; }
    .preview-ko {
      font-size: 14.5px;
      color: var(--ink-soft);
      margin-bottom: 6px;
    }
    .preview-text {
      font-family: 'Fraunces', serif;
      font-size: 17px;
      line-height: 1.6;
      color: var(--wine-deep);
      margin-bottom: 8px;
    }
    .preview-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }
    .entries {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .empty {
      font-size: 14px;
      color: var(--ink-faint);
      padding: 30px 4px;
      border: 1px dashed var(--border);
      border-radius: 4px;
      text-align: center;
    }
    .date-group {
      border-left: 3px solid var(--border);
    }
    .date-group-header {
      cursor: pointer;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      user-select: none;
    }
    .date-group-toggle {
      font-size: 12px;
      color: var(--ink-soft);
    }
    .date-group-title {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-soft);
      letter-spacing: 0.05em;
      flex: 1;
    }
    .date-group-count {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--ink-faint);
    }
    .date-group-entries {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 0 16px 8px;
    }
    .entry-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px 14px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .entry-item-content { flex: 1; min-width: 0; }
    .entry-item-preview {
      font-size: 13px;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .entry-item-del {
      font-size: 12px;
      color: var(--ink-faint);
      padding: 4px;
    }
    .detail-view { display: none; }
    .detail-view.show { display: block; }
    .detail-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .detail-title {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-soft);
      letter-spacing: 0.05em;
    }
    .detail-entries {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .detail-entry {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 16px;
    }
    .detail-entry-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .detail-entry-date {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11.5px;
      color: var(--ink-faint);
    }
    .detail-entry-del {
      font-size: 12px;
      color: var(--ink-faint);
      cursor: pointer;
      padding: 4px;
    }
    .sentence-pair {
      margin-bottom: 14px;
      position: relative;
    }
    .entry-ko {
      font-size: 15px;
      line-height: 1.7;
      color: var(--ink);
      white-space: pre-wrap;
      margin-bottom: 10px;
    }
    .mask {
      border-radius: 3px;
      background: var(--ink);
      height: 36px;
      margin-bottom: 8px;
    }
    .en-block {
      display: none;
      background: var(--wine-tint);
      border-radius: 3px;
      padding: 10px 12px;
    }
    .en-block.shown { display: block; }
    .mask.shown { display: none; }
    .entry-en {
      font-family: 'Fraunces', serif;
      font-size: 15px;
      line-height: 1.6;
      color: var(--wine-deep);
      margin-bottom: 10px;
    }
    .listen-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(124,59,73,0.08);
      border: 1px solid rgba(124,59,73,0.2);
      color: var(--wine-deep);
      font-size: 12px;
      border-radius: 999px;
      padding: 6px 10px;
      margin-top: 4px;
    }
    .edit-ko, .edit-en {
      width: 100%;
      resize: vertical;
      border: 1px solid var(--border);
      background: var(--paper);
      border-radius: 3px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 14.5px;
      line-height: 1.7;
      color: var(--ink);
      padding: 8px 10px;
      margin-bottom: 8px;
      min-height: 44px;
    }
    .edit-en {
      font-family: 'Fraunces', serif;
    }
    .edit-field-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: var(--ink-faint);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 3px;
    }
    .edit-err {
      font-size: 12px;
      color: var(--wine);
      margin-bottom: 8px;
      display: none;
    }
    .edit-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <button class="back-btn" id="backBtn">← 돌아가기</button>
      <div class="brand">한 줄<span class="dot">,</span> 영어로</div>
      <div class="streak">기록 <b id="entryCount">0</b>개</div>
    </header>

    <div class="share-bar" id="shareBar">
      <span class="share-label">공유 링크</span>
      <input type="text" id="shareUrl" readonly />
      <button class="btn-ghost" id="copyBtn">복사</button>
    </div>

    <div class="onboarding" id="onboarding">
      <p>공유 노트를 새로 만들면 링크가 생겨요.<br>그 링크를 받은 사람은 누구나 같은 노트를 보고, 함께 쓸 수 있어요.</p>
      <button class="btn-primary" id="createRoomBtn">공유 노트 만들기</button>
      <div class="warn" id="onboardErr"></div>
      <p class="warn">이 링크를 아는 사람은 누구나 보고 지울 수 있으니, 민감한 내용은 적지 마세요.</p>
    </div>

    <div id="appMain" style="display:none;">
      <section class="compose" id="compose">
        <div class="label">한글 문장 다음 줄에 영어 문장을 써주세요 (한글, 영어 번갈아가며)</div>
        <textarea id="koInput" placeholder="나는 매일 영어 공부를 한다.
I study English every single day.
매일 아침 30분씩 공부하는 것이 목표다.
My goal is to study for 30 minutes every morning."></textarea>
        <div class="err-msg" id="errMsg">한글 문장 다음 줄에 영어 문장을 써주세요. 줄 수가 짝이 맞아야 해요.</div>
        <div class="compose-foot">
          <button class="btn-primary" id="translateBtn">확인하기</button>
        </div>

        <div class="preview" id="preview">
          <div class="label">이렇게 저장돼요</div>
          <div id="previewList"></div>
          <div class="preview-actions">
            <button class="btn-ghost" id="discardBtn">취소</button>
            <button class="btn-primary" id="saveBtn">노트에 저장</button>
          </div>
        </div>
      </section>

      <div class="entries" id="entries"></div>

      <div class="detail-view" id="detailView">
        <div class="detail-header">
          <div class="detail-title" id="detailTitle"></div>
        </div>
        <div class="detail-entries" id="detailEntries"></div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: 'AIzaSyBM7bugwRjrCe3MMm6FFqEqGEMXC85bbl8',
      authDomain: 'vivian-project-f73d9.firebaseapp.com',
      projectId: 'vivian-project-f73d9',
      storageBucket: 'vivian-project-f73d9.firebasestorage.app',
      messagingSenderId: '110774190170',
      appId: '1:110774190170:web:399d59c14440a9ca6e1863'
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const backBtn = document.getElementById('backBtn');
    const koInput = document.getElementById('koInput');
    const translateBtn = document.getElementById('translateBtn');
    const errMsg = document.getElementById('errMsg');
    const preview = document.getElementById('preview');
    const previewList = document.getElementById('previewList');
    const discardBtn = document.getElementById('discardBtn');
    const saveBtn = document.getElementById('saveBtn');
    const entriesBox = document.getElementById('entries');
    const entryCount = document.getElementById('entryCount');
    const onboarding = document.getElementById('onboarding');
    const onboardErr = document.getElementById('onboardErr');
    const createRoomBtn = document.getElementById('createRoomBtn');
    const appMain = document.getElementById('appMain');
    const shareBar = document.getElementById('shareBar');
    const shareUrl = document.getElementById('shareUrl');
    const copyBtn = document.getElementById('copyBtn');
    const compose = document.getElementById('compose');
    const detailView = document.getElementById('detailView');
    const detailTitle = document.getElementById('detailTitle');
    const detailEntries = document.getElementById('detailEntries');

    let pendingSentences = [];
    let entries = [];
    let roomId = null;
    let selectedDate = null;
    let editingSentenceKey = null;

    function fmtDate(iso) {
      const d = new Date(iso);
      return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
    }

    function escapeHtml(str = '') {
      const div = document.createElement('div');
      div.textContent = String(str);
      return div.innerHTML;
    }

    function stripQuotes(text) {
      return String(text).replace(/^['"]+|['"]+$/g, '').trim();
    }

    function getRoomIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('room') || localStorage.getItem('lastRoomId');
    }

    function collection() {
      if (!roomId) return null;
      return db.collection('rooms').doc(roomId).collection('entries');
    }

    async function ensureAuthed() {
      let user = firebase.auth().currentUser;
      if (user) return user;
      const result = await firebase.auth().signInAnonymously();
      return result.user;
    }

    function isEntryOwner(entry, user) {
      if (!user) return false;
      if (!entry || !entry.ownerUid) return true;
      return entry.ownerUid === user.uid;
    }

    async function createRoom() {
      onboardErr.style.display = 'none';
      try {
        const user = await ensureAuthed();
        const id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID().slice(0, 12) : 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        const url = new URL(window.location.href);
        url.searchParams.set('room', id);
        window.history.replaceState({}, '', url.toString());
        roomId = id;
        localStorage.setItem('lastRoomId', id);
        entries = [];

        await db.collection('rooms').doc(id).set({
          createdAt: firebase.firestore.Timestamp.now(),
          public: true,
          ownerUid: user.uid
        });

        showApp();
        renderListView();
      } catch (err) {
        console.error('room 생성 실패', err);
        onboardErr.textContent = '방을 만들지 못했어요. 콘솔을 확인해주세요.';
        onboardErr.style.display = 'block';
      }
    }

    function showApp() {
      onboarding.style.display = 'none';
      shareBar.style.display = 'flex';
      appMain.style.display = 'block';
      shareUrl.value = window.location.href;
    }

    function parseInput() {
      const lines = koInput.value.split(/\n/).map(line => line.trim()).filter(Boolean);
      if (!lines.length || lines.length % 2 !== 0) return null;

      const pairs = [];
      for (let i = 0; i < lines.length; i += 2) {
        const ko = lines[i];
        const en = stripQuotes(lines[i + 1]);
        if (!ko || !en) return null;
        pairs.push({ ko, en });
      }
      return pairs;
    }

    function renderPreview() {
      const pairs = parseInput();
      if (!pairs) {
        preview.style.display = 'none';
        errMsg.style.display = 'block';
        return;
      }

      errMsg.style.display = 'none';
      previewList.innerHTML = pairs.map(pair => `
        <div class="preview-pair">
          <div class="preview-ko">${escapeHtml(pair.ko)}</div>
          <div class="preview-text">${escapeHtml(pair.en)}</div>
        </div>
      `).join('');
      preview.style.display = 'block';
      pendingSentences = pairs;
    }

    async function loadEntries() {
      if (!roomId) return;
      const col = collection();
      if (!col) return;
      try {
        const snap = await col.orderBy('createdAt', 'desc').get();
        entries = snap.docs.map(doc => {
          const data = doc.data();
          return {
            id: doc.id,
            sentences: Array.isArray(data.sentences) ? data.sentences : [],
            createdAt: data.createdAt && data.createdAt.toDate ? data.createdAt.toDate().toISOString() : new Date(data.createdAt || Date.now()).toISOString(),
            ownerUid: data.ownerUid || null
          };
        });
      } catch (e) {
        console.error(e);
        entries = [];
      }
      renderListView();
    }

    async function insertEntry(entry) {
      const user = await ensureAuthed();
      const col = collection();
      if (!col) return;
      await col.doc(entry.id).set({
        sentences: entry.sentences,
        createdAt: firebase.firestore.Timestamp.fromDate(new Date(entry.createdAt)),
        ownerUid: user.uid
      });
    }

    async function deleteEntry(id) {
      const col = collection();
      if (!col) return;
      await col.doc(id).delete();
    }

    async function updateEntrySentences(id, sentences) {
      const col = collection();
      if (!col) return;
      await col.doc(id).update({ sentences });
    }

    async function appendEntrySentences(entryId, newPairs) {
      if (!Array.isArray(newPairs) || newPairs.length === 0) {
        throw new Error('newPairs must be a non-empty array');
      }
      const user = await ensureAuthed();
      const col = collection();
      if (!col) throw new Error('Room not selected');

      const entryRef = col.doc(entryId);
      return firebase.firestore().runTransaction(async tx => {
        const doc = await tx.get(entryRef);
        if (!doc.exists) throw new Error('Entry not found');

        const data = doc.data() || {};
        const entry = { ownerUid: data.ownerUid || user.uid };
        if (!isEntryOwner(entry, user)) {
          throw new Error('권한 없음: 이 항목에 추가할 수 없습니다.');
        }

        const current = Array.isArray(data.sentences) ? data.sentences : [];
        const updated = current.concat(newPairs.map(p => ({ ko: p.ko, en: p.en })));
        tx.update(entryRef, { sentences: updated, updatedAt: firebase.firestore.Timestamp.now() });
        return { before: current.length, after: updated.length };
      });
    }

    function groupByDate(items) {
      const groups = {};
      items.forEach(entry => {
        const key = fmtDate(entry.createdAt);
        if (!groups[key]) groups[key] = [];
        groups[key].push(entry);
      });
      return groups;
    }

    function goToDetailView(date) {
      selectedDate = date;
      backBtn.classList.add('show');
      compose.classList.add('hidden');
      entriesBox.style.display = 'none';
      detailView.classList.add('show');
      renderDetailView();
    }

    function goToListView() {
      editingSentenceKey = null;
      backBtn.classList.remove('show');
      compose.classList.remove('hidden');
      entriesBox.style.display = 'flex';
      detailView.classList.remove('show');
      renderListView();
    }

    function renderListView() {
      entryCount.textContent = String(entries.length);
      entriesBox.innerHTML = '';

      if (!entries.length) {
        entriesBox.innerHTML = '<div class="empty">아직 저장된 노트가 없어요. 위에서 오늘의 문장을 적어보세요.</div>';
        return;
      }

      const sorted = [...entries].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      const grouped = groupByDate(sorted);
      const dates = Object.keys(grouped).sort((a, b) => new Date(b) - new Date(a));

      dates.forEach(dateKey => {
        const group = document.createElement('div');
        group.className = 'date-group';

        const header = document.createElement('div');
        header.className = 'date-group-header';
        header.innerHTML = `
          <div class="date-group-toggle">▾</div>
          <div class="date-group-title">${dateKey}</div>
          <div class="date-group-count">${grouped[dateKey].length}</div>
        `;

        const body = document.createElement('div');
        body.className = 'date-group-entries';

        grouped[dateKey].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).forEach(entry => {
          const item = document.createElement('div');
          item.className = 'entry-item';
          const previewText = (entry.sentences || []).map(s => s.ko).slice(0, 2).join(' · ');
          item.innerHTML = `
            <div class="entry-item-content">
              <div class="entry-item-preview">${escapeHtml(previewText || '문장 없음')}</div>
            </div>
            <div class="entry-item-del" data-id="${entry.id}">삭제</div>
          `;

          item.addEventListener('click', e => {
            if (e.target.closest('.entry-item-del')) return;
            goToDetailView(dateKey);
            selectedDate = dateKey;
            renderDetailView();
          });

          item.querySelector('.entry-item-del').addEventListener('click', async e => {
            e.stopPropagation();
            const user = firebase.auth().currentUser;
            if (!user || !isEntryOwner(entry, user)) {
              alert('삭제 권한이 없습니다. 이 항목을 만든 사용자만 삭제할 수 있습니다.');
              return;
            }
            try {
              await deleteEntry(entry.id);
              entries = entries.filter(item => item.id !== entry.id);
              renderListView();
            } catch (err) {
              console.error(err);
              alert('삭제하지 못했어요. 잠시 후 다시 시도해주세요.');
            }
          });

          body.appendChild(item);
        });

        header.addEventListener('click', () => {
          const collapsed = body.style.display === 'none';
          body.style.display = collapsed ? 'flex' : 'none';
          header.querySelector('.date-group-toggle').textContent = collapsed ? '▾' : '▸';
        });

        group.appendChild(header);
        group.appendChild(body);
        entriesBox.appendChild(group);
      });
    }

    function speakEnglish(text) {
      if (!('speechSynthesis' in window)) {
        alert('이 브라우저는 음성 재생을 지원하지 않습니다. Chrome 또는 Edge를 추천해요.');
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.96;
      utterance.pitch = 1;
      utterance.volume = 1;
      window.speechSynthesis.speak(utterance);
    }

    function renderDetailView() {
      if (!selectedDate) return;
      const grouped = groupByDate(entries);
      const dayEntries = grouped[selectedDate] || [];

      detailTitle.textContent = selectedDate;
      detailEntries.innerHTML = '';

      dayEntries.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).forEach(entry => {
        const card = document.createElement('div');
        card.className = 'detail-entry';

        const pairsHtml = (entry.sentences || []).map((s, idx) => {
          const key = `${entry.id}_${idx}`;
          if (editingSentenceKey === key) {
            return `
              <div class="sentence-pair" data-editing-key="${key}">
                <div class="edit-field-label">한글</div>
                <textarea class="edit-ko">${escapeHtml(s.ko)}</textarea>
                <div class="edit-field-label">영어</div>
                <textarea class="edit-en">${escapeHtml(s.en)}</textarea>
                <div class="edit-err"></div>
                <div class="edit-actions">
                  <button class="btn-ghost sentence-edit-cancel">취소</button>
                  <button class="btn-primary sentence-edit-save">저장</button>
                </div>
              </div>
            `;
          }

          return `
            <div class="sentence-pair">
              <div class="entry-ko" data-key="${key}" title="클릭해서 이 문장만 수정">${escapeHtml(s.ko)}</div>
              <div class="mask" data-key="${key}"></div>
              <div class="en-block" data-key="${key}">
                <div class="entry-en">${escapeHtml(s.en)}</div>
                <button class="listen-btn" data-speak="${escapeHtml(s.en)}">🔊 듣기</button>
              </div>
            </div>
          `;
        }).join('');

        card.innerHTML = `
          <div class="detail-entry-header">
            <div class="detail-entry-date" data-id="${entry.id}">${fmtDate(entry.createdAt)}</div>
            <div class="detail-entry-actions">
              <button class="detail-entry-del" data-id="${entry.id}" aria-label="삭제">삭제</button>
            </div>
          </div>
          ${pairsHtml}
        `;

        const actionsEl = card.querySelector('.detail-entry-actions');
        if (actionsEl) {
          const addBtn = document.createElement('button');
          addBtn.className = 'btn-ghost';
          addBtn.textContent = '문장 추가';
          addBtn.addEventListener('click', () => {
            if (card.querySelector('.add-sentence-form')) return;

            const form = document.createElement('div');
            form.className = 'add-sentence-form';
            form.innerHTML = `
              <div class="edit-field-label">한글</div>
              <textarea class="edit-ko"></textarea>
              <div class="edit-field-label">영어</div>
              <textarea class="edit-en"></textarea>
              <div class="edit-err" style="display:none;"></div>
              <div class="edit-actions">
                <button class="btn-ghost add-cancel">취소</button>
                <button class="btn-primary add-save">추가</button>
              </div>
            `;
            card.appendChild(form);

            form.querySelector('.add-cancel').addEventListener('click', () => form.remove());
            form.querySelector('.add-save').addEventListener('click', async () => {
              const ko = form.querySelector('.edit-ko').value.trim();
              const en = stripQuotes(form.querySelector('.edit-en').value.trim());
              const errEl = form.querySelector('.edit-err');

              if (!ko || !en) {
                errEl.textContent = '한글과 영어 문장을 모두 입력해주세요.';
                errEl.style.display = 'block';
                return;
              }

              const user = firebase.auth().currentUser;
              if (!user || !isEntryOwner(entry, user)) {
                alert('추가 권한이 없습니다. 작성자만 문장을 추가할 수 있습니다.');
                return;
              }

              try {
                const btn = form.querySelector('.add-save');
                btn.disabled = true;
                btn.textContent = '추가 중...';
                await appendEntrySentences(entry.id, [{ ko, en }]);
                entry.sentences = (entry.sentences || []).concat([{ ko, en }]);
                form.remove();
                renderDetailView();
              } catch (err) {
                console.error(err);
                errEl.textContent = err.message || '추가 실패';
                errEl.style.display = 'block';
              }
            });
          });
          actionsEl.appendChild(addBtn);
        }

        card.querySelectorAll('.entry-ko').forEach(koEl => {
          koEl.addEventListener('click', e => {
            e.stopPropagation();
            editingSentenceKey = koEl.dataset.key;
            renderDetailView();
          });
        });

        card.querySelectorAll('.mask').forEach(mask => {
          mask.addEventListener('click', e => {
            e.stopPropagation();
            const key = mask.dataset.key;
            const block = card.querySelector(`.en-block[data-key="${key}"]`);
            if (block) block.classList.add('shown');
            mask.classList.add('shown');
          });
        });

        card.querySelectorAll('.en-block').forEach(block => {
          block.addEventListener('click', e => {
            e.stopPropagation();
            block.classList.remove('shown');
            const mask = card.querySelector(`.mask[data-key="${block.dataset.key}"]`);
            if (mask) mask.classList.remove('shown');
          });
        });

        card.querySelectorAll('.listen-btn').forEach(btn => {
          btn.addEventListener('click', e => {
            e.stopPropagation();
            speakEnglish(btn.dataset.speak || '');
          });
        });

        const editingBlock = card.querySelector('.sentence-pair[data-editing-key]');
        if (editingBlock) {
          const key = editingBlock.dataset.editingKey;
          const idx = Number(key.split('_').pop());
          const koTextarea = editingBlock.querySelector('.edit-ko');
          const enTextarea = editingBlock.querySelector('.edit-en');
          const editErr = editingBlock.querySelector('.edit-err');

          editingBlock.querySelector('.sentence-edit-cancel').addEventListener('click', e => {
            e.stopPropagation();
            editingSentenceKey = null;
            renderDetailView();
          });

          editingBlock.querySelector('.sentence-edit-save').addEventListener('click', async e => {
            e.stopPropagation();
            const newKo = koTextarea.value.trim();
            const newEn = stripQuotes(enTextarea.value.trim());
            if (!newKo || !newEn) {
              editErr.textContent = '한글과 영어 문장을 모두 입력해주세요.';
              editErr.style.display = 'block';
              return;
            }

            const user = firebase.auth().currentUser;
            if (!user || !isEntryOwner(entry, user)) {
              alert('이 문장을 수정할 권한이 없습니다. 작성자만 수정할 수 있습니다.');
              return;
            }

            const btn = e.currentTarget;
            btn.disabled = true;
            btn.textContent = '저장 중...';
            const updatedSentences = (entry.sentences || []).map((s, i) => i === idx ? { ko: newKo, en: newEn } : s);
            try {
              await updateEntrySentences(entry.id, updatedSentences);
              entry.sentences = updatedSentences;
              editingSentenceKey = null;
              renderDetailView();
            } catch (err) {
              console.error(err);
              editErr.textContent = '저장하지 못했어요. 잠시 후 다시 시도해주세요.';
              editErr.style.display = 'block';
              btn.disabled = false;
              btn.textContent = '저장';
            }
          });
        }

        const delBtn = card.querySelector('.detail-entry-del');
        delBtn.addEventListener('click', async e => {
          e.stopPropagation();
          const user = firebase.auth().currentUser;
          if (!user || !isEntryOwner(entry, user)) {
            alert('삭제 권한이 없습니다. 이 항목을 만든 사용자만 삭제할 수 있습니다.');
            return;
          }

          try {
            await deleteEntry(entry.id);
            entries = entries.filter(item => item.id !== entry.id);
            const grouped = groupByDate(entries);
            if (!grouped[selectedDate] || grouped[selectedDate].length === 0) {
              goToListView();
            } else {
              renderDetailView();
            }
          } catch (err) {
            console.error(err);
            alert('삭제하지 못했어요. 잠시 후 다시 시도해주세요.');
          }
        });

        detailEntries.appendChild(card);
      });
    }

    async function saveEntry() {
      const pairs = pendingSentences;
      if (!pairs || !pairs.length) return;

      const user = await ensureAuthed();
      const entry = {
        id: 'e_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
        sentences: pairs,
        createdAt: new Date().toISOString(),
        ownerUid: user.uid
      };

      await insertEntry(entry);
      entries.unshift(entry);
      koInput.value = '';
      preview.style.display = 'none';
      pendingSentences = [];
      renderListView();
    }

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(shareUrl.value);
        copyBtn.textContent = '복사됨';
        setTimeout(() => copyBtn.textContent = '복사', 1200);
      } catch (e) {
        shareUrl.select();
        document.execCommand('copy');
      }
    });

    translateBtn.addEventListener('click', renderPreview);
    discardBtn.addEventListener('click', () => {
      preview.style.display = 'none';
      pendingSentences = [];
    });
    saveBtn.addEventListener('click', saveEntry);
    createRoomBtn.addEventListener('click', createRoom);
    backBtn.addEventListener('click', goToListView);

    firebase.auth().onAuthStateChanged(async user => {
      if (!roomId) {
        roomId = getRoomIdFromUrl();
      }
      if (roomId) {
        showApp();
        await loadEntries();
      }
    });

    (async function initFromUrl() {
      const room = getRoomIdFromUrl();
      if (room) {
        roomId = room;
        showApp();
        await loadEntries();
      }
    })();
  </script>
</body>
</html>
