<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한 줄, 영어로</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EAEADF;
    --paper-line:#D8D8C8;
    --card:#F4F4EC;
    --ink:#1E2C22;
    --ink-soft:#4B5A4E;
    --ink-faint:#8A9088;
    --wine:#7C3B49;
    --wine-deep:#5A2A34;
    --wine-tint:#F1E0E2;
    --gold:#B08A3E;
    --border:#CFCFBC;
    --shadow:0 1px 0 rgba(30,44,34,0.06);
    --correction:#E8F5E9;
    --correction-border:#A5D6A7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR', -apple-system, sans-serif;
    min-height:100vh;
  }
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:48px 24px 80px;
  }
  header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:36px;
    border-bottom:1px solid var(--border);
    padding-bottom:20px;
  }
  .brand{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:26px;
    letter-spacing:-0.01em;
  }
  .brand .dot{color:var(--wine);}
  .streak{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-faint);
    text-align:right;
  }
  .streak b{color:var(--ink-soft); font-weight:500;}
  .back-btn{
    background:var(--paper);
    border:1px solid var(--border);
    border-radius:3px;
    padding:8px 12px;
    font-family:'Noto Sans KR', sans-serif;
    font-size:13px;
    color:var(--ink-soft);
    cursor:pointer;
    transition:background .15s ease;
    display:none;
  }
  .back-btn:hover{background:rgba(30,44,34,0.05);}
  .back-btn.show{display:block;}

  .compose{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:4px;
    padding:22px 24px 20px;
    margin-bottom:44px;
    position:relative;
  }
  .compose.hidden{display:none;}
  .compose .label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    color:var(--ink-faint);
    text-transform:uppercase;
    margin-bottom:10px;
  }
  textarea#koInput{
    width:100%;
    min-height:110px;
    resize:vertical;
    border:none;
    background:transparent;
    outline:none;
    font-family:'Noto Sans KR', sans-serif;
    font-size:17px;
    line-height:1.9;
    color:var(--ink);
    padding:0;
    background-image:repeating-linear-gradient(transparent, transparent 37px, var(--paper-line) 38px);
  }
  textarea#koInput::placeholder{color:var(--ink-faint);}

  .compose-foot{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:10px;
    margin-top:14px;
  }
  button{
    font-family:'Noto Sans KR', sans-serif;
    cursor:pointer;
    border:none;
    background:none;
  }
  .btn-primary{
    background:var(--ink);
    color:var(--paper);
    font-size:14px;
    font-weight:500;
    padding:10px 20px;
    border-radius:3px;
    transition:background .15s ease, transform .1s ease;
  }
  .btn-primary:hover{background:var(--wine-deep);}
  .btn-primary:active{transform:scale(0.98);}
  .btn-primary:disabled{background:var(--ink-faint); cursor:default;}
  .btn-ghost{
    font-size:13px;
    color:var(--ink-faint);
    padding:10px 10px;
  }
  .btn-ghost:hover{color:var(--ink-soft);}
  .err-msg{
    font-size:12px;
    color:var(--wine);
    margin-top:6px;
    display:none;
  }

  .preview{
    display:none;
    margin-top:18px;
    padding-top:16px;
    border-top:1px dashed var(--border);
  }
  .preview .label{color:var(--wine);}
  .preview-pair{
    margin-bottom:18px;
  }
  .preview-pair:last-child{margin-bottom:0;}
  .preview-ko{
    font-size:14.5px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .preview-text{
    font-family:'Fraunces', serif;
    font-size:17px;
    line-height:1.6;
    color:var(--wine-deep);
    margin-bottom:8px;
  }
  .preview-correction{
    background:var(--correction);
    border:1px solid var(--correction-border);
    border-radius:3px;
    padding:10px 12px;
    font-size:13px;
    line-height:1.5;
    color:var(--ink);
    display:none;
  }
  .preview-correction.show{display:block;}
  .preview-correction strong{
    color:var(--wine-deep);
    font-weight:600;
  }
  .preview-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:14px;
  }

  .list-head{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    color:var(--ink-faint);
    text-transform:uppercase;
    margin:0 0 14px 2px;
  }
  .entries{display:flex; flex-direction:column; gap:12px;}
  .empty{
    font-size:14px;
    color:var(--ink-faint);
    padding:30px 4px;
    border:1px dashed var(--border);
    border-radius:4px;
    text-align:center;
  }
  
  .date-group{
    border-left:3px solid var(--border);
    padding-left:0;
  }
  .date-group-header{
    cursor:pointer;
    padding:12px 16px;
    display:flex;
    align-items:center;
    gap:8px;
    user-select:none;
    transition:background .15s ease;
  }
  .date-group-header:hover{
    background:rgba(30,44,34,0.03);
  }
  .date-group-toggle{
    font-size:12px;
    color:var(--ink-soft);
    transition:transform .2s ease;
  }
  .date-group-toggle.collapsed{
    transform:rotate(-90deg);
  }
  .date-group-title{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    letter-spacing:0.05em;
    flex:1;
  }
  .date-group-count{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-faint);
  }
  .date-group-entries{
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:0 16px 8px 16px;
    max-height:1000px;
    overflow:hidden;
    transition:max-height .3s ease, opacity .3s ease, padding .3s ease;
    opacity:1;
  }
  .date-group-entries.collapsed{
    max-height:0;
    opacity:0;
    padding:0 16px;
  }

  .entry-item{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:4px;
    padding:10px 14px;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
  }
  .entry-item:hover{
    background:rgba(30,44,34,0.02);
    border-color:var(--wine);
  }
  .entry-item-content{
    flex:1;
    min-width:0;
  }
  .entry-item-preview{
    font-size:13px;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .entry-item-del{
    font-size:12px;
    color:var(--ink-faint);
    flex-shrink:0;
    cursor:pointer;
    padding:4px;
  }
  .entry-item-del:hover{color:var(--wine);}

  .detail-view{
    display:none;
  }
  .detail-view.show{
    display:block;
  }
  .detail-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:24px;
    padding-bottom:16px;
    border-bottom:1px solid var(--border);
  }
  .detail-title{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    letter-spacing:0.05em;
  }
  .date-text{
    cursor:pointer;
    border-bottom:1px dashed var(--ink-faint);
    transition: color .15s ease, border-color .15s ease;
  }
  .date-text:hover{
    color:var(--wine);
    border-bottom-color:var(--wine);
  }
  .date-input{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    padding:1px 4px;
    border:1px solid var(--border);
    border-radius:3px;
    outline:none;
    background:var(--paper);
    color:var(--ink);
  }
  .detail-entries{
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .detail-entry{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:4px;
    padding:16px;
  }
  .detail-entry-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
  }
  .detail-entry-date{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--ink-faint);
  }
  .detail-entry-actions{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .detail-entry-del{
    font-size:12px;
    color:var(--ink-faint);
    cursor:pointer;
    padding:4px;
  }
  .detail-entry-del:hover{color:var(--wine);}
  .entry-ko{
    font-size:15px;
    line-height:1.7;
    color:var(--ink);
    white-space:pre-wrap;
    margin-bottom:10px;
    cursor:pointer;
    border-bottom:1px dashed transparent;
    transition:border-color .15s ease, color .15s ease;
  }
  .entry-ko:hover{
    border-bottom-color:var(--ink-faint);
  }
  .sentence-pair{
    margin-bottom:14px;
  }
  .sentence-pair:last-child{margin-bottom:0;}
  .mask{
    border-radius:3px;
    cursor:pointer;
    background:var(--ink);
    height:36px;
    transition:background .15s ease;
    margin-bottom:8px;
  }
  .mask:hover{background:var(--wine-deep);}
  .en-block{
    display:none;
    padding:10px 12px;
    background:var(--wine-tint);
    border-radius:3px;
    cursor:pointer;
  }
  .en-block.shown{display:block;}
  .mask.shown{display:none;}
  .entry-en{
    font-family:'Fraunces', serif;
    font-size:15px;
    line-height:1.6;
    color:var(--wine-deep);
  }
  .hide-hint{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    color:var(--ink-faint);
    margin-top:8px;
  }

  .edit-textarea{
    width:100%;
    min-height:100px;
    resize:vertical;
    border:1px solid var(--border);
    background:var(--paper);
    border-radius:3px;
    outline:none;
    font-family:'Noto Sans KR', sans-serif;
    font-size:14.5px;
    line-height:1.8;
    color:var(--ink);
    padding:10px 12px;
    margin-bottom:10px;
  }
  .edit-ko, .edit-en{
    width:100%;
    resize:vertical;
    border:1px solid var(--border);
    background:var(--paper);
    border-radius:3px;
    outline:none;
    font-family:'Noto Sans KR', sans-serif;
    font-size:14.5px;
    line-height:1.7;
    color:var(--ink);
    padding:8px 10px;
    margin-bottom:6px;
    min-height:44px;
  }
  .edit-en{
    font-family:'Fraunces', serif;
    min-height:44px;
  }
  .edit-field-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    color:var(--ink-faint);
    text-transform:uppercase;
    letter-spacing:0.05em;
    margin-bottom:3px;
  }
  .edit-err{
    font-size:12px;
    color:var(--wine);
    margin-bottom:8px;
    display:none;
  }
  .edit-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
  }

  .share-bar{
    display:none;
    align-items:center;
    gap:10px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:4px;
    padding:12px 14px;
    margin-bottom:24px;
  }
  .share-bar .share-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-faint);
    text-transform:uppercase;
    letter-spacing:0.06em;
    white-space:nowrap;
  }
  .share-bar input{
    flex:1;
    min-width:0;
    border:1px solid var(--border);
    background:var(--paper);
    border-radius:3px;
    padding:8px 10px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
  }
  .onboarding{
    text-align:center;
    padding:60px 20px;
    border:1px dashed var(--border);
    border-radius:4px;
  }
  .onboarding p{
    font-size:14px;
    color:var(--ink-soft);
    line-height:1.7;
    max-width:420px;
    margin:0 auto 22px;
  }
  .onboarding .warn{
    font-size:12px;
    color:var(--ink-faint);
    margin-top:14px;
  }
  .loading-dots::after{
    content:'';
    animation:dots 1.2s steps(4,end) infinite;
  }
  @keyframes dots{
    0%{content:'';} 25%{content:'.';} 50%{content:'..';} 75%{content:'...';} 100%{content:'';}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <button class="back-btn" id="backBtn">← 돌아가기</button>
    <div class="brand">한 줄<span class="dot">,</span> 영어로</div>
    <div class="streak" id="streakBox">기록 <b id="entryCount">0</b>개</div>
  </header>

  <div class="share-bar" id="shareBar">
    <span class="share-label">공유 링크</span>
    <input type="text" id="shareUrl" readonly>
    <button class="btn-ghost" id="copyBtn">복사</button>
  </div>

  <div class="onboarding" id="onboarding">
    <p>공유 노트를 새로 만들면 링크가 생겨요.<br>그 링크를 받은 사람은 누구나 같은 노트를 보고, 함께 쓸 수 있어요.</p>
    <button class="btn-primary" id="createRoomBtn">공유 노트 만들기</button>
    <div class="warn" id="onboardErr" style="display:none; color:var(--wine);"></div>
    <p class="warn">이 링크를 아는 사람은 누구나 보고 지울 수 있으니, 민감한 내용은 적지 마세요.</p>
  </div>

  <div id="appMain" style="display:none;">

  <section class="compose" id="compose">
    <div class="label">한글 문장 다음 줄에 영어 문장을 써주세요 (한글, 영어 번갈아가며)</div>
    <textarea id="koInput" placeholder='나는 매일 영어 공부를 한다.
I study English every single day.
매일 아침 30분씩 공부하는 것이 목표다.
My goal is to study for 30 minutes every morning.'></textarea>
    <div class="err-msg" id="errMsg">한글 문장 다음 줄에 영어 문장을 써주세요. 줄 수가 짝이 맞아야 해요.</div>
    <div class="compose-foot">
      <button class="btn-primary" id="translateBtn">확인하기</button>
    </div>

    <div class="preview" id="preview">
      <div class="label">이렇게 저장돼요</div>
      <div id="previewList"></div>
      <div class="preview-actions">
        <button class="btn-ghost" id="discardBtn">취소</button>
        <button class="btn-primary" id="saveBtn">노트에 저장</button>
      </div>
    </div>
  </section>

  <div class="list-head">지난 기록 <span style="text-transform:none; letter-spacing:0; color:var(--ink-faint);">· 이 링크를 여는 모든 사람과 공유됩니다</span></div>
  <div class="entries" id="entries">
    <div class="empty" id="emptyState">아직 저장된 노트가 없어요. 위에서 오늘의 문장을 적어보세요.</div>
  </div>

  <div class="detail-view" id="detailView">
    <div class="detail-header">
      <div class="detail-title" id="detailTitle"></div>
    </div>
    <div class="detail-entries" id="detailEntries"></div>
  </div>

  </div>

</div>

<script>
const backBtn = document.getElementById('backBtn');
const koInput = document.getElementById('koInput');
const translateBtn = document.getElementById('translateBtn');
const errMsg = document.getElementById('errMsg');
const preview = document.getElementById('preview');
const previewList = document.getElementById('previewList');
const discardBtn = document.getElementById('discardBtn');
const saveBtn = document.getElementById('saveBtn');
const entriesBox = document.getElementById('entries');
const emptyState = document.getElementById('emptyState');
const entryCount = document.getElementById('entryCount');
const onboarding = document.getElementById('onboarding');
const onboardErr = document.getElementById('onboardErr');
const createRoomBtn = document.getElementById('createRoomBtn');
const appMain = document.getElementById('appMain');
const shareBar = document.getElementById('shareBar');
const shareUrl = document.getElementById('shareUrl');
const copyBtn = document.getElementById('copyBtn');
const compose = document.getElementById('compose');
const detailView = document.getElementById('detailView');
const detailTitle = document.getElementById('detailTitle');
const detailEntries = document.getElementById('detailEntries');

let pendingSentences = [];
let entries = [];
let roomId = null;
let currentView = 'list';
let selectedDate = null;
let editingSentenceKey = null; // format: `${entryId}_${idx}`

function fmtDate(iso){
  const d = new Date(iso);
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}

function getLocalDateString(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

const SUPABASE_URL = 'https://dzpiornjgtevorjiipsx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_5M1HdJd_jv2Re1vI8nkaKw_aH1CGW0d';

const SB_HEADERS = {
  'apikey': SUPABASE_ANON_KEY,
  'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
  'Content-Type': 'application/json'
};

async function checkEnglish(text) {
  try {
    const response = await fetch('https://api.languagetool.org/v2/check', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        text: text,
        language: 'en-US'
      })
    });
    if (!response.ok) return null;
    const data = await response.json();
    if (data.matches && data.matches.length > 0) {
      return data.matches.map(m => ({
        message: m.message,
        replacement: m.replacements.length > 0 ? m.replacements[0].value : null,
        offset: m.offset,
        length: m.length
      }));
    }
  } catch (e) {
    console.error('Grammar check failed:', e);
  }
  return null;
}

function showApp(){
  onboarding.style.display = 'none';
  shareBar.style.display = 'flex';
  appMain.style.display = 'block';
  shareUrl.value = window.location.href;
}

function genRoomId(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID().slice(0, 12);
  return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function createRoom(){
  onboardErr.style.display = 'none';
  const id = genRoomId();
  const url = new URL(window.location.href);
  url.searchParams.set('room', id);
  window.history.replaceState({}, '', url.toString());
  roomId = id;
  localStorage.setItem('lastRoomId', id);
  entries = [];
  showApp();
  renderListView();
}

async function loadEntries(){
  try{
    const url = `${SUPABASE_URL}/rest/v1/entries?room_id=eq.${encodeURIComponent(roomId)}&order=created_at.desc`;
    const res = await fetch(url, { headers: SB_HEADERS });
    if(!res.ok) throw new Error('load failed: ' + res.status);
    const rows = await res.json();
    entries = rows.map(r => ({ id: r.id, sentences: r.sentences, createdAt: r.created_at }));
  }catch(e){
    console.error(e);
    entries = [];
  }
  renderListView();
}

async function insertEntry(entry){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/entries`, {
    method: 'POST',
    headers: { ...SB_HEADERS, 'Prefer': 'return=minimal' },
    body: JSON.stringify({
      id: entry.id,
      room_id: roomId,
      sentences: entry.sentences,
      created_at: entry.createdAt
    })
  });
  if(!res.ok) throw new Error('insert failed: ' + res.status);
}

async function deleteEntry(id){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/entries?id=eq.${encodeURIComponent(id)}`, {
    method: 'DELETE',
    headers: SB_HEADERS
  });
  if(!res.ok) throw new Error('delete failed: ' + res.status);
}

async function updateEntryDate(id, newIso){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/entries?id=eq.${encodeURIComponent(id)}`, {
    method: 'PATCH',
    headers: { ...SB_HEADERS, 'Prefer': 'return=representation' },
    body: JSON.stringify({ created_at: newIso })
  });
  if(!res.ok) throw new Error('update failed: ' + res.status);
  const rows = await res.json();
  if(!Array.isArray(rows) || rows.length === 0) throw new Error('no rows updated (RLS policy?)');
}

async function updateEntrySentences(id, sentences){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/entries?id=eq.${encodeURIComponent(id)}`, {
    method: 'PATCH',
    headers: { ...SB_HEADERS, 'Prefer': 'return=representation' },
    body: JSON.stringify({ sentences })
  });
  if(!res.ok) throw new Error('update failed: ' + res.status);
  const rows = await res.json();
  if(!Array.isArray(rows) || rows.length === 0) throw new Error('no rows updated (RLS policy?)');
}

function checkPassword() {
  const pwd = prompt('삭제하시려면 비밀번호를 입력하세요');
  if (pwd !== '5604') {
    if (pwd !== null) alert('비밀번호가 일치하지 않습니다.');
    return false;
  }
  return true;
}

function groupByDate(entries) {
  const groups = {};
  entries.forEach(entry => {
    const date = fmtDate(entry.createdAt);
    if (!groups[date]) {
      groups[date] = [];
    }
    groups[date].push(entry);
  });
  return groups;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function entryToRawText(entry){
  return entry.sentences.map(s => `${s.ko}\n${s.en}`).join('\n');
}

function goToDetailView(date) {
  selectedDate = date;
  currentView = 'detail';
  editingSentenceKey = null;
  backBtn.classList.add('show');
  compose.classList.add('hidden');
  entriesBox.style.display = 'none';
  detailView.classList.add('show');
  renderDetailView();
}

function goToListView() {
  currentView = 'list';
  editingSentenceKey = null;
  backBtn.classList.remove('show');
  compose.classList.remove('hidden');
  entriesBox.style.display = 'flex';
  detailView.classList.remove('show');
  renderListView();
}

function renderDetailView() {
  const sorted = [...entries].sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
  const grouped = groupByDate(sorted);
  const dayEntries = grouped[selectedDate] || [];
  
  detailTitle.textContent = selectedDate;
  detailEntries.innerHTML = '';
  
  dayEntries.sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt)).forEach(entry => {
    const card = document.createElement('div');
    card.className = 'detail-entry';

    const pairsHtml = entry.sentences.map((s, idx) => {
      const key = entry.id + '_' + idx;
      if(editingSentenceKey === key){
        return `
          <div class="sentence-pair" data-editing-key="${key}">
            <div class="edit-field-label">한글</div>
            <textarea class="edit-ko">${escapeHtml(s.ko)}</textarea>
            <div class="edit-field-label">영어</div>
            <textarea class="edit-en">${escapeHtml(s.en)}</textarea>
            <div class="edit-err"></div>
            <div class="edit-actions">
              <button class="btn-ghost sentence-edit-cancel">취소</button>
              <button class="btn-primary sentence-edit-save">저장</button>
            </div>
          </div>
        `;
      }
      return `
        <div class="sentence-pair">
          <div class="entry-ko" data-key="${key}" title="클릭해서 이 문장만 수정">${escapeHtml(s.ko)}</div>
          <div class="mask" data-key="${key}"></div>
          <div class="en-block" data-key="${key}">
            <div class="entry-en">${escapeHtml(s.en)}</div>
          </div>
        </div>
      `;
    }).join('');

    card.innerHTML = `
      <div class="detail-entry-header">
        <div class="detail-entry-date" data-id="${entry.id}">
          <span class="date-text" title="날짜 수정">${fmtDate(entry.createdAt)}</span>
          <input type="date" class="date-input" style="display:none;" value="${getLocalDateString(entry.createdAt)}">
        </div>
        <div class="detail-entry-actions">
          <button class="detail-entry-del" data-id="${entry.id}" aria-label="삭제">삭제</button>
        </div>
      </div>
      ${pairsHtml}
      <div class="hide-hint">문장을 누르면 영어가 나타나고, 한글 문장을 누르면 그 문장만 수정할 수 있어요</div>
    `;

    // 문장별 수정: 한글 문장을 클릭하면 그 문장만 편집 모드로
    card.querySelectorAll('.entry-ko').forEach(koEl => {
      koEl.addEventListener('click', (e) => {
        e.stopPropagation();
        editingSentenceKey = koEl.dataset.key;
        renderDetailView();
      });
    });

    // 편집 중인 문장의 저장/취소 처리
    const editingBlock = card.querySelector('.sentence-pair[data-editing-key]');
    if(editingBlock){
      const key = editingBlock.dataset.editingKey;
      const idx = parseInt(key.split('_').pop(), 10);
      const koTextarea = editingBlock.querySelector('.edit-ko');
      const enTextarea = editingBlock.querySelector('.edit-en');
      const editErr = editingBlock.querySelector('.edit-err');

      editingBlock.querySelector('.sentence-edit-cancel').addEventListener('click', (e) => {
        e.stopPropagation();
        editingSentenceKey = null;
        renderDetailView();
      });

      editingBlock.querySelector('.sentence-edit-save').addEventListener('click', async (e) => {
        e.stopPropagation();
        const newKo = koTextarea.value.trim();
        const newEn = stripQuotes(enTextarea.value.trim());
        if(!newKo || !newEn){
          editErr.textContent = '한글과 영어 문장을 모두 입력해주세요.';
          editErr.style.display = 'block';
          return;
        }
        const btn = e.currentTarget;
        btn.disabled = true;
        btn.textContent = '저장 중...';
        const updatedSentences = entry.sentences.map((s, i) => i === idx ? { ko: newKo, en: newEn } : s);
        try{
          await updateEntrySentences(entry.id, updatedSentences);
          entry.sentences = updatedSentences;
          editingSentenceKey = null;
          renderDetailView();
        }catch(err){
          console.error(err);
          editErr.textContent = '저장하지 못했어요. 잠시 후 다시 시도해주세요.';
          editErr.style.display = 'block';
          btn.disabled = false;
          btn.textContent = '저장';
        }
      });
    }

    card.querySelector('.detail-entry-del').addEventListener('click', (e) => {
      e.stopPropagation();
      if (!checkPassword()) return;
      deleteEntry(entry.id).then(() => {
        entries = entries.filter(en => en.id !== entry.id);
        const remaining = groupByDate(entries)[selectedDate];
        if(!remaining || remaining.length === 0) {
          goToListView();
        } else {
          renderDetailView();
        }
      }).catch(err => {
        console.error(err);
        alert('삭제하지 못했어요. 잠시 후 다시 시도해주세요.');
      });
    });

    const dateText = card.querySelector('.date-text');
    const dateInput = card.querySelector('.date-input');
    const dateContainer = card.querySelector('.detail-entry-date');

    dateText.addEventListener('click', (e) => {
      e.stopPropagation();
      dateText.style.display = 'none';
      dateInput.style.display = 'inline-block';
      dateInput.focus();
    });

    const finishEdit = async () => {
      if(dateInput.dataset.saving === 'true') return;
      dateInput.dataset.saving = 'true';
      const newDateStr = dateInput.value;
      
      if (newDateStr) {
         const newIso = new Date(newDateStr + 'T00:00:00').toISOString();
         const entryId = dateContainer.dataset.id;
         const entryRef = entries.find(en => en.id === entryId);
         
         if (entryRef && entryRef.createdAt !== newIso) {
             try {
                 await updateEntryDate(entryId, newIso);
                 entryRef.createdAt = newIso;
                 selectedDate = fmtDate(newIso);
             } catch(err) {
                 alert('날짜 수정에 실패했습니다.');
                 console.error(err);
             }
         }
      }
      renderDetailView();
    };

    dateInput.addEventListener('blur', finishEdit);
    dateInput.addEventListener('keydown', (ev) => { if(ev.key === 'Enter') finishEdit(); });
    
    detailEntries.appendChild(card);
  });

  detailEntries.addEventListener('click', (e) => {
    const mask = e.target.closest('.mask');
    if(mask){
      e.stopPropagation();
      const key = mask.dataset.key;
      mask.classList.add('shown');
      const block = detailEntries.querySelector(`.en-block[data-key="${key}"]`);
      if(block) block.classList.add('shown');
      return;
    }
    const block = e.target.closest('.en-block');
    if(block){
      e.stopPropagation();
      block.classList.remove('shown');
      const key = block.dataset.key;
      const maskEl = detailEntries.querySelector(`.mask[data-key="${key}"]`);
      if(maskEl) maskEl.classList.remove('shown');
      return;
    }
  });
}

function renderListView(){
  entryCount.textContent = entries.length;
  entriesBox.innerHTML = '';
  
  if(entries.length === 0){
    entriesBox.appendChild(emptyState);
    return;
  }
  
  const sorted = [...entries].sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
  const grouped = groupByDate(sorted);
  
  Object.keys(grouped).sort().reverse().forEach(date => {
    const dateGroup = document.createElement('div');
    dateGroup.className = 'date-group';
    
    const dayEntries = grouped[date].sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
    const count = dayEntries.length;
    
    const header = document.createElement('div');
    header.className = 'date-group-header';
    header.innerHTML = `
      <div class="date-group-toggle">▼</div>
      <div class="date-group-title">${date}</div>
      <div class="date-group-count">${count}개</div>
    `;
    header.addEventListener('click', () => toggleDateGroup(header));
    dateGroup.appendChild(header);
    
    const entriesWrapper = document.createElement('div');
    entriesWrapper.className = 'date-group-entries';
    
    dayEntries.forEach(entry => {
      const item = document.createElement('div');
      item.className = 'entry-item';
      
      const previewTextRaw = entry.sentences[0]?.ko || '(내용 없음)';
      const previewText = previewTextRaw.length > 35 ? previewTextRaw.substring(0, 35) + '...' : previewTextRaw;
      
      item.innerHTML = `
        <div class="entry-item-content">
          <div class="entry-item-preview">${escapeHtml(previewText)}</div>
        </div>
        <button class="entry-item-del" data-id="${entry.id}" aria-label="삭제">삭제</button>
      `;
      
      item.querySelector('.entry-item-content').addEventListener('click', () => {
        goToDetailView(date);
      });
      
      item.querySelector('.entry-item-del').addEventListener('click', (e) => {
        e.stopPropagation();
        if (!checkPassword()) return;
        deleteEntry(entry.id).then(() => {
          entries = entries.filter(en => en.id !== entry.id);
          renderListView();
        }).catch(err => {
          console.error(err);
          alert('삭제하지 못했어요. 잠시 후 다시 시도해주세요.');
        });
      });
      
      entriesWrapper.appendChild(item);
    });
    
    dateGroup.appendChild(entriesWrapper);
    entriesBox.appendChild(dateGroup);
  });
}

function toggleDateGroup(header) {
  const group = header.closest('.date-group');
  const entriesDiv = group.querySelector('.date-group-entries');
  const toggle = header.querySelector('.date-group-toggle');
  
  entriesDiv.classList.toggle('collapsed');
  toggle.classList.toggle('collapsed');
}

function stripQuotes(str){
  return str.replace(/^["'“‘]+/, '').replace(/["'”’]+$/, '').trim();
}

function parsePairs(raw){
  const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
  if(lines.length === 0) return { error: '한글 문장 다음 줄에 영어 문장을 써주세요.' };
  if(lines.length % 2 !== 0) return { error: '줄 수가 짝이 맞지 않아요. 한글 한 줄, 영어 한 줄씩 번갈아 써주세요.' };
  const pairs = [];
  for(let i = 0; i < lines.length; i += 2){
    pairs.push({ ko: lines[i], en: stripQuotes(lines[i+1]) });
  }
  return { pairs };
}

translateBtn.addEventListener('click', async () => {
  const { pairs, error } = parsePairs(koInput.value);
  if(error){
    errMsg.textContent = error;
    errMsg.style.display = 'block';
    return;
  }
  errMsg.style.display = 'none';
  pendingSentences = pairs;
  
  const pairsWithCorrections = await Promise.all(pairs.map(async (p) => {
    const corrections = await checkEnglish(p.en);
    return { ...p, corrections };
  }));
  
  previewList.innerHTML = pairsWithCorrections.map((p, idx) => `
    <div class="preview-pair">
      <div class="preview-ko">${escapeHtml(p.ko)}</div>
      <div class="preview-text">${escapeHtml(p.en)}</div>
      ${p.corrections && p.corrections.length > 0 ? `
        <div class="preview-correction show">
          <strong>💡 제안:</strong><br>
          ${p.corrections.map(c => `
            <div style="margin-top:6px;">
              <strong>${c.message}</strong><br>
              ${c.replacement ? `제안: "<strong>${c.replacement}</strong>"` : ''}
            </div>
          `).join('')}
        </div>
      ` : ''}
    </div>
  `).join('');
  preview.style.display = 'block';
});

discardBtn.addEventListener('click', () => {
  preview.style.display = 'none';
  pendingSentences = [];
});

saveBtn.addEventListener('click', async () => {
  if(pendingSentences.length === 0) return;
  const entry = {
    id: 'e_' + Date.now() + '_' + Math.random().toString(36).slice(2,8),
    sentences: pendingSentences,
    createdAt: new Date().toISOString()
  };
  saveBtn.disabled = true;
  try{
    await insertEntry(entry);
    entries.push(entry);
    renderListView();
    koInput.value = '';
    preview.style.display = 'none';
    pendingSentences = [];
  }catch(e){
    console.error(e);
    errMsg.textContent = '저장하지 못했어요. Supabase 설정(URL/키)을 확인해주세요.';
    errMsg.style.display = 'block';
  }finally{
    saveBtn.disabled = false;
  }
});

backBtn.addEventListener('click', goToListView);

createRoomBtn.addEventListener('click', createRoom);

copyBtn.addEventListener('click', async () => {
  try{
    await navigator.clipboard.writeText(shareUrl.value);
    copyBtn.textContent = '복사됨';
    setTimeout(() => { copyBtn.textContent = '복사'; }, 1500);
  }catch(e){
    shareUrl.select();
  }
});

(function init(){
  const params = new URLSearchParams(window.location.search);
  const existingRoom = params.get('room');
  if(existingRoom){
    roomId = existingRoom;
    showApp();
    loadEntries();
  }
  else {
    const savedRoomId = localStorage.getItem('lastRoomId');
    if(savedRoomId){
      roomId = savedRoomId;
      const url = new URL(window.location.href);
      url.searchParams.set('room', savedRoomId);
      window.history.replaceState({}, '', url.toString());
      showApp();
      loadEntries();
    }
  }
})();
</script>
