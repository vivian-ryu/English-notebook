const status = document.getElementById('status');
const button = document.getElementById('migrateBtn');
button.addEventListener('click', async () => {
  button.disabled = true;
  status.className = 'status';
  status.textContent = '이전 중...';
  try {
    const batch = db.batch();
    entries.forEach(entry => {
      const ref = db.collection('rooms').doc(roomId).collection('entries').doc(entry.id);
      batch.set(ref, {
        sentences: entry.sentences,
        createdAt: firebase.firestore.Timestamp.fromDate(new Date(entry.createdAt))
      });
    });
    await batch.commit();
    status.className = 'status ok';
    status.textContent = `완료되었습니다. ${entries.length}개 노트를 이전했습니다.\n\n확인 주소:\nhttps://english-notebook-phi.vercel.app/?room=${roomId}`;
  } catch (error) {
    console.error(error);
    status.className = 'status error';
    status.textContent = '이전하지 못했습니다.\n' + (error.message || error);
    button.disabled = false;
  }
});
